# Boardly local production stack — Postgres + the sync/API server, both
# containerized so the whole backend comes up with one command and survives
# reboots (see docs/GUIDE-local-production.md):
#   docker compose up -d --build
#
# The production desktop app (Tauri) talks to this stack on
# http://localhost:8788 (HTTP + ws://localhost:8788/sync) — a different host
# port than the dev server (8787) so the two never collide.
#
# For host-based server dev instead, bring up just Postgres — `docker compose up
# -d db` — and run `pnpm --filter @boardly/server dev` (defaults to 8787).
services:
  db:
    # Defaults to Postgres 17; override with POSTGRES_IMAGE if that tag can't be
    # pulled in a given environment (any modern Postgres works for this schema).
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: boardly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardly}
      POSTGRES_DB: ${POSTGRES_DB:-boardly}
    ports:
      # Host port defaults to 5433 to avoid colliding with a local 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - boardly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardly} -d ${POSTGRES_DB:-boardly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: boardly-server
    restart: unless-stopped
    depends_on:
      db:
        # Wait for Postgres to accept connections before booting (migrations
        # run immediately on start).
        condition: service_healthy
    environment:
      # Talk to Postgres over the compose network: host `db`, internal port
      # 5432 (NOT the host-mapped ${POSTGRES_PORT}). Credentials mirror the db
      # service above so both stay in sync from one set of vars.
      DATABASE_URL: postgres://${POSTGRES_USER:-boardly}:${POSTGRES_PASSWORD:-boardly}@db:5432/${POSTGRES_DB:-boardly}
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      # Origins allowed to call the API with credentials. Must include the
      # desktop webview origin: macOS Tauri uses `tauri://localhost`
      # (Windows/Android with useHttpsScheme use `https://tauri.localhost`).
      # http://localhost:3000 is the dev web app. Override via .env if needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,tauri://localhost,https://tauri.localhost}
    ports:
      # Host 8788 → container 8787. The production stack deliberately uses a
      # DIFFERENT host port than the dev server (8787) so both can coexist: the
      # Docker backend stays up (restart: unless-stopped) while you optionally
      # run `pnpm --filter @boardly/server dev` on 8787. The desktop app is
      # built to point at this host port (NEXT_PUBLIC_API_URL).
      - "${BOARDLY_SERVER_PORT:-8788}:8787"

volumes:
  boardly_pgdata:
