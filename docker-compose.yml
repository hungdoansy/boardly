# Boardly LOCAL DEV infrastructure — Postgres only.
#
# This stack is for developing Boardly: the sync/API server runs on the HOST
# with hot reload (`pnpm --filter @boardly/server dev`, port 8787) and talks to
# this container over DATABASE_URL (see .env). The dev web app (`next dev`,
# port 3000) / `tauri dev` point at that 8787 server.
#
#   docker compose up -d            # start the dev database
#   pnpm --filter @boardly/server dev
#
# The always-on PRODUCTION stack is entirely separate — its own containers,
# database, volume, and network — so you can USE the app (production) while you
# DEVELOP against this dev database without either touching the other. See
# docker-compose.prod.yml and docs/GUIDE-local-production.md.
#
# Attachment images: the host dev server writes uploaded bytes to `UPLOADS_DIR`,
# which defaults to `./data/uploads` (gitignored) — no volume here because the
# server isn't containerized in dev. In prod the same UPLOADS_DIR points at a
# Docker volume instead (see docker-compose.prod.yml). Same code path, different
# value.
services:
  db:
    # Pinned to 16 to match the existing boardly_pgdata volume (a newer major
    # refuses a data dir initialized by an older one).
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: boardly-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardly}
      POSTGRES_DB: ${POSTGRES_DB:-boardly}
    ports:
      # Host port defaults to 5433 to avoid colliding with a local 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - boardly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardly} -d ${POSTGRES_DB:-boardly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Resolves to boardly_boardly_pgdata under the default (dir-named) project —
  # the pre-existing dev data volume.
  boardly_pgdata:
