name: Release
run-name: Release v${{ inputs.version }}

# Builds the desktop app, then commits the version bump + changelog to main, tags
# it, and publishes a GitHub Release. Docs: docs/units/UNIT-23-release-pipeline.md
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true
      # Only macOS arm64 builds by default. The others are complete and off: tick one
      # for a single run, or flip its `default` to build it on every run.
      mac_arm64:
        description: "Build macOS arm64"
        type: boolean
        default: true
      mac_x64:
        description: "Build macOS x64"
        type: boolean
        default: false
      windows_x64:
        description: "Build Windows x64"
        type: boolean
        default: false
      linux_x64:
        description: "Build Linux x64"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      date: ${{ steps.meta.outputs.date }}
      matrix: ${{ steps.targets.outputs.matrix }}
      changelog: ${{ steps.changelog.outputs.text }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Validate version
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in X.Y.Z format (got: $VERSION)"
            exit 1
          fi

          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

      - name: Pick build targets
        id: targets
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/release/resolve-targets.mjs

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # An explicit reporter stops Vitest adding its github-actions one, which writes a
      # "Vitest Test Report" to the run summary once per package.
      - name: Test
        run: pnpm run test -- --reporter=default

      - name: Generate changelog
        id: changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/release/generate-changelog.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Set app version
        run: node scripts/release/set-version.mjs "${{ needs.prepare.outputs.version }}"

      # beforeBuildCommand builds the web export, baking NEXT_PUBLIC_API_URL from
      # apps/web/.env.production into the app.
      #
      # "-" ad-hoc signs the whole bundle. Without it only the binary carries a linker
      # signature, the .app fails verification, and macOS reports a downloaded copy as
      # damaged rather than offering to open it. Ignored on Windows and Linux.
      - name: Build app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm --filter @boardly/desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boardly-${{ matrix.name }}
          retention-days: 1
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update CHANGELOG.md
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DATE: ${{ needs.prepare.outputs.date }}
          ENTRIES: ${{ needs.prepare.outputs.changelog }}
        run: node scripts/release/prepend-changelog.mjs

      - name: Update app version
        run: node scripts/release/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Commit, tag, and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/CHANGELOG.md apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          git commit -m "release: $TAG"
          git tag -m "$TAG" "$TAG"
          git push origin main
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: ${{ needs.prepare.outputs.changelog }}
          draft: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage

      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: boardly-*
