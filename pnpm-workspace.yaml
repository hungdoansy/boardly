packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  sharp: false

# sharp (pulled transitively by Next) is not required: the web app is a static
# export with images.unoptimized=true. esbuild is allowed because `tsx` and
# `drizzle-kit` (the @boardly/server + @boardly/mcp dev tooling) need its
# platform binary installed post-download.
onlyBuiltDependencies:
  - esbuild

# Skip the pre-run "deps are up to date" check: it re-runs `pnpm install`, which
# exits non-zero on the (expected, allow-listed) esbuild build-script notice and
# would otherwise fail every `pnpm --filter <pkg> <script>` invocation.
verifyDepsBeforeRun: false
