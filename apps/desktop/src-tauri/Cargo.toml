[package]
name = "boardly"
version = "1.0.0"
description = "Boardly — local-first kanban desktop shell"
authors = ["Boardly"]
edition = "2021"
rust-version = "1.77"

# The desktop binary. Tauri v2's mobile targets are out of scope (see plan), so
# no lib/mobile entry point — a plain binary crate wrapping the web export.
[[bin]]
name = "boardly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native capabilities (Unit 5.2).
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"

# Refresh-token storage in the OS keychain (Keychain / Credential Manager /
# libsecret) — not Stronghold. `keyring` v3 with the platform-native backends.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Single-instance (desktop only) so `boardly://` deep links reach the running
# app rather than spawning a second instance.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
