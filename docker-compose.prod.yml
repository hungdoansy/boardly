# Boardly PRODUCTION stack — the app you actually USE, entirely in Docker.
#
# Postgres + the sync/API server, both containerized, with their OWN database,
# volume, containers, and network — fully isolated from local dev
# (docker-compose.yml). That isolation is the point: you can run the production
# app AND develop locally at the same time without either touching the other.
#
# The `name:` below pins a dedicated compose project, so volumes/networks are
# prefixed `boardly-prod_` and never collide with the dev project. Run it with
# the -f flag (the project name is applied automatically from `name:`):
#
#   docker compose -f docker-compose.prod.yml up -d --build     # start / update
#   docker compose -f docker-compose.prod.yml ps                # status
#   docker compose -f docker-compose.prod.yml logs -f server    # logs
#   docker compose -f docker-compose.prod.yml down              # stop (keeps data)
#   docker compose -f docker-compose.prod.yml down -v           # stop + WIPE data
#
# The production desktop app talks to this stack on http://localhost:8788
# (built with NEXT_PUBLIC_API_URL=http://localhost:8788).
name: boardly-prod

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: boardly-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardly}
      POSTGRES_DB: ${POSTGRES_DB:-boardly}
    volumes:
      # Dedicated production volume (→ boardly-prod_pgdata). NOT the dev volume.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardly} -d ${POSTGRES_DB:-boardly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published: only the `server` container talks to it, over the
    # compose network. (Add `ports: ["5434:5432"]` if you ever need host access
    # without colliding with the dev db on 5433.)

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: boardly-prod-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Talk to Postgres over the compose network: host `db`, internal port 5432.
      DATABASE_URL: postgres://${POSTGRES_USER:-boardly}:${POSTGRES_PASSWORD:-boardly}@db:5432/${POSTGRES_DB:-boardly}
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      # Origins allowed to call the API with credentials. Includes the desktop
      # webview origin: macOS Tauri uses `tauri://localhost`.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,tauri://localhost,https://tauri.localhost}
    ports:
      # Host 8788 → container 8787. Different from the dev server (8787) so both
      # can run at once. The desktop app is built to point here. Bound to loopback
      # so the API and its login aren't reachable from the local network.
      - "127.0.0.1:${BOARDLY_SERVER_PORT:-8788}:8787"

volumes:
  pgdata:
